<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relay console two</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:32px;line-height:1.5;color:#1a1a1a;background:#1c1230}
  .card{background:#fff;border-radius:12px;padding:26px;max-width:440px}
  code{font-size:22px}
</style>
</head>
<body>
<div class="card">
  <h1>Relay console two</h1>
  <p>Key part 2:</p>
  <p><code id="part">unavailable</code></p>
  <p style="color:#666;font-size:13px">Assemble both parts back at the operations bay.</p>
</div>
<script>
const m = location.hash.match(/p=([A-Za-z0-9]+)/);
document.getElementById("part").textContent = m ? m[1] : "unavailable — reopen from relay one";
</script>
</body>
</html>
